[package]
name = "nosleep"
version = "0.3.0"
edition = "2024"
license = "MIT"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
tao = "0.35.0"
thiserror = "2.0.18"
tray-icon = "0.22.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3.2", features = ["CFRunLoop"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "4", features = ["blocking"] }
